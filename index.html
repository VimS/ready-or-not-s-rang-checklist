<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ready or Not - S-Rang Checkliste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      /* Light Mode */
      --bg-primary: var(--gray-50);
      --bg-card: white;
      --text-primary: var(--gray-900);
      --text-secondary: var(--gray-600);
      --border-color: var(--gray-200);
      --border-hover: var(--primary);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --border-hover: #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 1rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-bar {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .category-section {
      margin-bottom: 2rem;
    }

    .category-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mission-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    .mission-card:hover {
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-color: var(--border-hover);
    }

    .mission-card.completed {
      opacity: 0.6;
    }

    .mission-card.completed .mission-title {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .mission-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      margin-bottom: 0.25rem;
    }

    .mission-title:hover {
      color: var(--primary);
    }

    .mission-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .mission-map {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 28px;
      font-style: italic;
    }

    .mission-checkboxes {
      display: flex;
      gap: 1.5rem;
      margin-left: 28px;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .checkbox-group input {
      accent-color: var(--success);
      cursor: pointer;
    }

    .checkbox-group label {
      cursor: pointer;
    }

    .difficulty-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-left: auto;
    }

    .difficulty-easy {
      background: #d1fae5;
      color: #065f46;
    }

    .difficulty-medium {
      background: #fef3c7;
      color: #92400e;
    }

    .difficulty-hard {
      background: #fee2e2;
      color: #991b1b;
    }

    [data-theme="dark"] .difficulty-easy {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    [data-theme="dark"] .difficulty-medium {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    [data-theme="dark"] .difficulty-hard {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .spoiler-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 28px;
      margin-top: 0.5rem;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      user-select: none;
    }

    .spoiler-toggle:hover {
      opacity: 0.8;
    }

    .spoiler-toggle.revealed .spoiler-arrow {
      transform: rotate(90deg);
    }

    .spoiler-arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .spoiler-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .spoiler-content.revealed {
      max-height: 500px;
    }

    .tip {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 4px;
      font-size: 13px;
      color: var(--warning);
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border-color);
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .theme-toggle {
      margin-left: auto;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--border-hover);
      background: var(--bg-primary);
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .difficulty-badge {
        display: block;
        margin-left: 0;
        margin-top: 0.5rem;
        width: fit-content;
      }

      .mission-checkboxes {
        flex-direction: column;
        gap: 0.75rem;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="page-title"></h1>
      <p class="subtitle" id="page-subtitle"></p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="s-rank-num">0</div>
        <div class="stat-label" id="label-s-rank">S-Rang</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="higher-num">0</div>
        <div class="stat-label" id="label-higher">Höhere Schwierigkeiten</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-num">29</div>
        <div class="stat-label" id="label-total">Missionen</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>

    <div id="missions-container"></div>

    <div class="controls">
      <button class="btn-primary" id="btn-selectall" onclick="selectAll()"></button>
      <button class="btn-secondary" id="btn-deselectall" onclick="deselectAll()"></button>
      <button class="btn-danger" id="btn-reset" onclick="resetData()"></button>
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
      <button class="theme-toggle" id="lang-toggle" onclick="toggleLanguage()">🌐 English</button>
    </div>

    <footer>
      <p id="footer-text"></p>
    </footer>
  </div>

  <script>
    // Übersetzungen
    const translations = {
      de: {
        title: '🎮 Ready or Not - S-Rang Checkliste',
        subtitle: 'Verfolge deinen Fortschritt beim S-Rang aller Missionen',
        s_rank: 'S-Rang',
        higher_difficulties: 'Höhere Schwierigkeiten',
        total: 'Missionen',
        progress: 'Fortschritt',
        spoiler: 'SPOILER - Klick zum Anzeigen',
        tip: '💡 ',
        selectAll: '✓ Alle abhaken',
        deselectAll: '✗ Alle löschen',
        reset: '🔄 Zurücksetzen',
        resetConfirm: '🔄 Willst du wirklich alle Daten zurücksetzen?',
        footer: 'Erstellt mit ❤️ • Speichert Daten lokal im Browser (localStorage)',
        categories: {
          'Hauptkampagne': '🎮 Hauptkampagne',
          'Home Invasion DLC': '🏘️ Home Invasion DLC',
          'Los Sueños Stories': '🌆 Los Sueños Stories',
          'Dark Waters DLC': '🌊 Dark Waters DLC',
          'Boiling Point DLC': '🔥 Boiling Point DLC'
        },
        difficulties: {
          'easy': 'Einstieg',
          'medium': 'Mittel',
          'hard': 'Schwierig'
        },
        mapLabel: 'Karte: '
      },
      en: {
        title: '🎮 Ready or Not - S-Rank Checklist',
        subtitle: 'Track your progress to S-rank all missions',
        s_rank: 'S-Rank',
        higher_difficulties: 'Higher Difficulties',
        total: 'Missions',
        progress: 'Progress',
        spoiler: 'SPOILER - Click to reveal',
        tip: '💡 ',
        selectAll: '✓ Complete all',
        deselectAll: '✗ Clear all',
        reset: '🔄 Reset',
        resetConfirm: '🔄 Are you sure you want to reset all data?',
        footer: 'Made with ❤️ • Saves data locally in your browser (localStorage)',
        categories: {
          'Hauptkampagne': '🎮 Main Campaign',
          'Home Invasion DLC': '🏘️ Home Invasion DLC',
          'Los Sueños Stories': '🌆 Los Sueños Stories',
          'Dark Waters DLC': '🌊 Dark Waters DLC',
          'Boiling Point DLC': '🔥 Boiling Point DLC'
        },
        difficulties: {
          'easy': 'Introduction',
          'medium': 'Medium',
          'hard': 'Hard'
        },
        mapLabel: 'Map: '
      }
    };

    let currentLanguage;

    function t(key) {
      const keys = key.split('.');
      let value = translations[currentLanguage];
      for (let k of keys) {
        value = value[k];
      }
      return value;
    }

    function toggleLanguage() {
      currentLanguage = currentLanguage === 'de' ? 'en' : 'de';
      localStorage.setItem('ron-language', currentLanguage);
      location.reload();
    }

    const missions = [
      // Hauptkampagne
      { id: 1, name: 'Thank You, Come Again', map: '4U Gas Station', category: 'Hauptkampagne', difficulty: 'easy', tip: null },
      { id: 2, name: '23 Megabytes A Second', map: 'San Uriel Condominiums', category: 'Hauptkampagne', difficulty: 'medium', tip: 'Gegner braucht Multiple Agenten von verschiedenen Seiten!' },
      { id: 3, name: 'Twisted Nerve', map: '213 Park Homes', category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 4, name: 'The Spider', map: 'Brixley Talent Time', category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 5, name: 'A Lethal Obsession', map: "Sullivan's Slope", category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 6, name: 'Ides of March', map: 'Brisa Cove', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 7, name: 'Sinuous Trail', map: 'Mindjot Data Center', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 8, name: 'Ends of the Earth', map: 'Kawayu Beach', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 9, name: 'Greased Palms', map: 'Los Sueños Postal Service', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 10, name: 'Valley of the Dolls', map: 'Voll Health House', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 11, name: 'Elephant', map: 'Watt Community College', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 12, name: 'Rust Belt', map: 'Costa Vino Border Reserve', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 13, name: 'Sins of the Father', map: 'Clemente Hotel', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 14, name: 'Neon Tomb', map: 'Neon Nightclub', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 15, name: 'Buy Cheap, Buy Twice', map: "Caesar's Car Dealership", category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 16, name: 'Carriers of the Vine', map: 'Cherryesa Farm', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 17, name: 'Relapse', map: 'Coastal Grove Medical Center', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 18, name: 'Hide and Seek', map: 'Port Hokan', category: 'Hauptkampagne', difficulty: 'hard', tip: null },

      // Home Invasion DLC
      { id: 19, name: 'Dorms', map: 'Dorms', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },
      { id: 20, name: 'Narcos', map: 'Narcos', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },
      { id: 21, name: 'Lawmaker', map: 'Lawmaker Mansion', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },

      // Los Sueños Stories
      { id: 22, name: 'Stolen Valor', map: 'Stolen Valor Apartments', category: 'Los Sueños Stories', difficulty: 'medium', tip: null },
      { id: 23, name: 'Hunger Strike', map: 'Fast Food Restaurant', category: 'Los Sueños Stories', difficulty: 'medium', tip: null },

      // Dark Waters DLC
      { id: 24, name: 'Mirage at Sea', map: 'Luxury Yacht', category: 'Dark Waters DLC', difficulty: 'hard', tip: 'Yacht ist eng. Flashbangs sind dein bester Freund!' },
      { id: 25, name: 'Leviathan', map: 'Oil Rig', category: 'Dark Waters DLC', difficulty: 'hard', tip: 'Eco-Terroristen mit Geisel-Situation. Timing ist kritisch!' },
      { id: 26, name: '3 Letter Triad', map: 'Island Resort', category: 'Dark Waters DLC', difficulty: 'hard', tip: null },

      // Boiling Point DLC
      { id: 27, name: 'No Good Deed', map: 'Blackwood Pier', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Active Shooter Szenario. Schnelle Response ist kritisch!' },
      { id: 28, name: 'All Gods Burn', map: 'UnionTrust Bank', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Bomben-Defusal + Riot-Szenario. Komplexe Mission!' },
      { id: 29, name: 'A New America', map: 'City Hall', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Final-Mission! Terroristen + Bomben. Sehr anspruchsvoll!' }
    ];

    function initializePage() {
      loadTheme();
      updateLabels();
      renderMissions();
      loadData();
      updateProgress();
    }

    function updateLabels() {
      document.getElementById('page-title').textContent = t('title');
      document.getElementById('page-subtitle').textContent = t('subtitle');
      document.getElementById('label-s-rank').textContent = t('s_rank');
      document.getElementById('label-higher').textContent = t('higher_difficulties');
      document.getElementById('label-total').textContent = t('total');
      document.getElementById('btn-selectall').textContent = t('selectAll');
      document.getElementById('btn-deselectall').textContent = t('deselectAll');
      document.getElementById('btn-reset').textContent = t('reset');
      document.getElementById('footer-text').textContent = t('footer');
      document.getElementById('lang-toggle').textContent = currentLanguage === 'de' ? '🌐 English' : '🌐 Deutsch';
    }

    function renderMissions() {
      const container = document.getElementById('missions-container');
      container.innerHTML = '';
      let currentCategory = '';

      missions.forEach(mission => {
        if (mission.category !== currentCategory) {
          currentCategory = mission.category;
          const categoryDiv = document.createElement('div');
          categoryDiv.className = 'category-section';
          
          const title = document.createElement('div');
          title.className = 'category-title';
          title.textContent = t(`categories.${currentCategory}`);
          categoryDiv.appendChild(title);
          
          categoryDiv.id = `category-${currentCategory.replace(/\s+/g, '-')}`;
          container.appendChild(categoryDiv);
        }

        const categoryDiv = document.getElementById(`category-${currentCategory.replace(/\s+/g, '-')}`);
        
        const card = document.createElement('div');
        card.className = 'mission-card';
        card.id = `mission-${mission.id}`;
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'mission-title';
        
        const titleText = document.createElement('span');
        titleText.textContent = mission.name;
        
        const badge = document.createElement('span');
        badge.className = `difficulty-badge difficulty-${mission.difficulty}`;
        badge.textContent = t(`difficulties.${mission.difficulty}`);
        
        titleDiv.appendChild(titleText);
        titleDiv.appendChild(badge);
        card.appendChild(titleDiv);
        
        const mapDiv = document.createElement('div');
        mapDiv.className = 'mission-map';
        mapDiv.textContent = `${t('mapLabel')}${mission.map}`;
        card.appendChild(mapDiv);

        // Checkboxes Gruppe
        const checkboxGroup = document.createElement('div');
        checkboxGroup.className = 'mission-checkboxes';

        // S-Rank Checkbox
        const sRankGroup = document.createElement('div');
        sRankGroup.className = 'checkbox-group';

        const sRankCheckbox = document.createElement('input');
        sRankCheckbox.type = 'checkbox';
        sRankCheckbox.className = 'mission-checkbox';
        sRankCheckbox.dataset.id = mission.id;
        sRankCheckbox.dataset.type = 'srank';
        sRankCheckbox.onchange = () => {
          updateProgress();
          saveData();
          updateCardAppearance(mission.id);
        };

        const sRankLabel = document.createElement('label');
        sRankLabel.textContent = t('s_rank');
        sRankLabel.style.cursor = 'pointer';

        sRankGroup.appendChild(sRankCheckbox);
        sRankGroup.appendChild(sRankLabel);
        checkboxGroup.appendChild(sRankGroup);

        // Höhere Schwierigkeiten Checkbox
        const higherGroup = document.createElement('div');
        higherGroup.className = 'checkbox-group';

        const higherCheckbox = document.createElement('input');
        higherCheckbox.type = 'checkbox';
        higherCheckbox.className = 'mission-checkbox';
        higherCheckbox.dataset.id = mission.id;
        higherCheckbox.dataset.type = 'higher';
        higherCheckbox.onchange = () => {
          updateProgress();
          saveData();
          updateCardAppearance(mission.id);
        };

        const higherLabel = document.createElement('label');
        higherLabel.textContent = t('higher_difficulties');
        higherLabel.style.cursor = 'pointer';

        higherGroup.appendChild(higherCheckbox);
        higherGroup.appendChild(higherLabel);
        checkboxGroup.appendChild(higherGroup);

        card.appendChild(checkboxGroup);
        
        if (mission.tip) {
          const spoilerToggle = document.createElement('div');
          spoilerToggle.className = 'spoiler-toggle';
          spoilerToggle.onclick = (e) => {
            e.stopPropagation();
            spoilerToggle.classList.toggle('revealed');
            spoilerContent.classList.toggle('revealed');
          };
          spoilerToggle.innerHTML = `<span class="spoiler-arrow">▶</span> <span>${t('spoiler')}</span>`;
          card.appendChild(spoilerToggle);

          const spoilerContent = document.createElement('div');
          spoilerContent.className = 'spoiler-content';
          const tipDiv = document.createElement('div');
          tipDiv.className = 'tip';
          tipDiv.textContent = t('tip') + mission.tip;
          spoilerContent.appendChild(tipDiv);
          card.appendChild(spoilerContent);
        }
        
        categoryDiv.appendChild(card);
      });
    }

    function updateCardAppearance(missionId) {
      const sRankCheckbox = document.querySelector(`input[data-id="${missionId}"][data-type="srank"]`);
      const higherCheckbox = document.querySelector(`input[data-id="${missionId}"][data-type="higher"]`);
      const card = document.getElementById(`mission-${missionId}`);
      
      if (sRankCheckbox.checked && higherCheckbox.checked) {
        card.classList.add('completed');
      } else {
        card.classList.remove('completed');
      }
    }

    function updateProgress() {
      const sRankCheckboxes = document.querySelectorAll('input[data-type="srank"]');
      const higherCheckboxes = document.querySelectorAll('input[data-type="higher"]');
      
      const sRankCount = Array.from(sRankCheckboxes).filter(cb => cb.checked).length;
      const higherCount = Array.from(higherCheckboxes).filter(cb => cb.checked).length;
      
      document.getElementById('s-rank-num').textContent = sRankCount;
      document.getElementById('higher-num').textContent = higherCount;
      document.getElementById('total-num').textContent = missions.length;
      
      // Fortschritt basiert auf S-Rank
      const percentage = missions.length > 0 ? Math.round((sRankCount / missions.length) * 100) : 0;
      const progressFill = document.getElementById('progressFill');
      progressFill.style.width = percentage + '%';
    }

    function saveData() {
      const sRankCheckboxes = document.querySelectorAll('input[data-type="srank"]');
      const higherCheckboxes = document.querySelectorAll('input[data-type="higher"]');
      
      const sRankData = Array.from(sRankCheckboxes).map(cb => cb.checked);
      const higherData = Array.from(higherCheckboxes).map(cb => cb.checked);
      
      localStorage.setItem('ron-s-rank-data', JSON.stringify(sRankData));
      localStorage.setItem('ron-higher-diff-data', JSON.stringify(higherData));
    }

    function loadData() {
      const sRankSaved = localStorage.getItem('ron-s-rank-data');
      const higherSaved = localStorage.getItem('ron-higher-diff-data');
      
      if (sRankSaved) {
        const sRankData = JSON.parse(sRankSaved);
        const sRankCheckboxes = document.querySelectorAll('input[data-type="srank"]');
        sRankCheckboxes.forEach((cb, i) => {
          if (sRankData[i]) {
            cb.checked = true;
            updateCardAppearance(parseInt(cb.dataset.id));
          }
        });
      }
      
      if (higherSaved) {
        const higherData = JSON.parse(higherSaved);
        const higherCheckboxes = document.querySelectorAll('input[data-type="higher"]');
        higherCheckboxes.forEach((cb, i) => {
          if (higherData[i]) {
            cb.checked = true;
            updateCardAppearance(parseInt(cb.dataset.id));
          }
        });
      }
    }

    function selectAll() {
      document.querySelectorAll('input[data-type="srank"]').forEach(cb => {
        cb.checked = true;
        updateCardAppearance(parseInt(cb.dataset.id));
      });
      updateProgress();
      saveData();
    }

    function deselectAll() {
      document.querySelectorAll('input[data-type="srank"], input[data-type="higher"]').forEach(cb => {
        cb.checked = false;
        updateCardAppearance(parseInt(cb.dataset.id));
      });
      updateProgress();
      saveData();
    }

    function resetData() {
      if (confirm(t('resetConfirm'))) {
        localStorage.removeItem('ron-s-rank-data');
        localStorage.removeItem('ron-higher-diff-data');
        deselectAll();
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      const currentTheme = html.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      html.setAttribute('data-theme', newTheme);
      button.textContent = newTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
      localStorage.setItem('ron-theme', newTheme);
    }

    function loadTheme() {
      const saved = localStorage.getItem('ron-theme') || 'light';
      const html = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      
      html.setAttribute('data-theme', saved);
      button.textContent = saved === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    // Initialize
    currentLanguage = localStorage.getItem('ron-language') || 'de';
    initializePage();
  </script>
</body>
</html>
