<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ready or Not - S-Rang Checkliste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      /* Light Mode */
      --bg-primary: var(--gray-50);
      --bg-card: white;
      --text-primary: var(--gray-900);
      --text-secondary: var(--gray-600);
      --border-color: var(--gray-200);
      --border-hover: var(--primary);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --border-hover: #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 1rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--gray-900);
    }

    .subtitle {
      font-size: 14px;
      color: var(--gray-500);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-bar {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .category-section {
      margin-bottom: 2rem;
    }

    .category-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mission-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    .mission-card:hover {
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-color: var(--border-hover);
    }

    .mission-card.completed {
      opacity: 0.6;
    }

    .mission-card.completed .mission-title {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .mission-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      margin-bottom: 0.25rem;
    }

    .mission-title:hover {
      color: var(--primary);
    }

    .mission-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .mission-map {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 28px;
      font-style: italic;
    }

    .spoiler-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 28px;
      margin-top: 0.5rem;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      user-select: none;
    }

    .spoiler-toggle:hover {
      opacity: 0.8;
    }

    .spoiler-toggle.revealed .spoiler-arrow {
      transform: rotate(90deg);
    }

    .spoiler-arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .spoiler-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .spoiler-content.revealed {
      max-height: 500px;
    }

    .difficulty-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-left: auto;
    }

    .difficulty-easy {
      background: #d1fae5;
      color: #065f46;
    }

    .difficulty-medium {
      background: #fef3c7;
      color: #92400e;
    }

    .difficulty-hard {
      background: #fee2e2;
      color: #991b1b;
    }

    .tip {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 4px;
      font-size: 13px;
      color: var(--warning);
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border-color);
      flex-wrap: wrap;
    }

    .theme-toggle {
      margin-left: auto;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--border-hover);
      background: var(--bg-primary);
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .difficulty-badge {
        display: block;
        margin-left: 0;
        margin-top: 0.5rem;
        width: fit-content;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 Ready or Not - S-Rang Checkliste</h1>
      <p class="subtitle">Verfolge deinen Fortschritt beim S-Rang aller Missionen</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="completed-num">0</div>
        <div class="stat-label">Abgehakt</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-num">29</div>
        <div class="stat-label">Missionen</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="percentage-num">0%</div>
        <div class="stat-label">Fortschritt</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>

    <div id="missions-container"></div>

    <div class="controls">
      <button class="btn-primary" onclick="selectAll()">✓ Alle abhaken</button>
      <button class="btn-secondary" onclick="deselectAll()">✗ Alle löschen</button>
      <button class="btn-danger" onclick="resetData()">🔄 Zurücksetzen</button>
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <footer>
      <p>Erstellt mit ❤️ • Speichert Daten lokal im Browser (localStorage)</p>
    </footer>
  </div>

  <script>
    const missions = [
      // Hauptkampagne
      { id: 1, name: 'Thank You, Come Again', map: '4U Gas Station', category: 'Hauptkampagne', difficulty: 'easy', tip: null },
      { id: 2, name: '23 Megabytes A Second', map: 'San Uriel Condominiums', category: 'Hauptkampagne', difficulty: 'medium', tip: 'Gegner braucht Multiple Agenten von verschiedenen Seiten!' },
      { id: 3, name: 'Twisted Nerve', map: '213 Park Homes', category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 4, name: 'The Spider', map: 'Brixley Talent Time', category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 5, name: 'A Lethal Obsession', map: "Sullivan's Slope", category: 'Hauptkampagne', difficulty: 'medium', tip: null },
      { id: 6, name: 'Ides of March', map: 'Brisa Cove', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 7, name: 'Sinuous Trail', map: 'Mindjot Data Center', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 8, name: 'Ends of the Earth', map: 'Kawayu Beach', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 9, name: 'Greased Palms', map: 'Los Sueños Postal Service', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 10, name: 'Valley of the Dolls', map: 'Voll Health House', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 11, name: 'Elephant', map: 'Watt Community College', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 12, name: 'Rust Belt', map: 'Costa Vino Border Reserve', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 13, name: 'Sins of the Father', map: 'Clemente Hotel', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 14, name: 'Neon Tomb', map: 'Neon Nightclub', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 15, name: 'Buy Cheap, Buy Twice', map: "Caesar's Car Dealership", category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 16, name: 'Carriers of the Vine', map: 'Cherryesa Farm', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 17, name: 'Relapse', map: 'Coastal Grove Medical Center', category: 'Hauptkampagne', difficulty: 'hard', tip: null },
      { id: 18, name: 'Hide and Seek', map: 'Port Hokan', category: 'Hauptkampagne', difficulty: 'hard', tip: null },

      // Home Invasion DLC
      { id: 19, name: 'Dorms', map: 'Dorms', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },
      { id: 20, name: 'Narcos', map: 'Narcos', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },
      { id: 21, name: 'Lawmaker', map: 'Lawmaker Mansion', category: 'Home Invasion DLC', difficulty: 'hard', tip: null },

      // Los Sueños Stories
      { id: 22, name: 'Stolen Valor', map: 'Stolen Valor Apartments', category: 'Los Sueños Stories', difficulty: 'medium', tip: null },
      { id: 23, name: 'Hunger Strike', map: 'Fast Food Restaurant', category: 'Los Sueños Stories', difficulty: 'medium', tip: null },

      // Dark Waters DLC
      { id: 24, name: 'Mirage at Sea', map: 'Luxury Yacht', category: 'Dark Waters DLC', difficulty: 'hard', tip: 'Yacht ist eng. Flashbangs sind dein bester Freund!' },
      { id: 25, name: 'Leviathan', map: 'Oil Rig', category: 'Dark Waters DLC', difficulty: 'hard', tip: 'Eco-Terroristen mit Geisel-Situation. Timing ist kritisch!' },
      { id: 26, name: '3 Letter Triad', map: 'Island Resort', category: 'Dark Waters DLC', difficulty: 'hard', tip: null },

      // Boiling Point DLC
      { id: 27, name: 'No Good Deed', map: 'Blackwood Pier', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Active Shooter Szenario. Schnelle Response ist kritisch!' },
      { id: 28, name: 'All Gods Burn', map: 'UnionTrust Bank', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Bomben-Defusal + Riot-Szenario. Komplexe Mission!' },
      { id: 29, name: 'A New America', map: 'City Hall', category: 'Boiling Point DLC', difficulty: 'hard', tip: 'Final-Mission! Terroristen + Bomben. Sehr anspruchsvoll!' }
    ];

    const categoryEmojis = {
      'Hauptkampagne': '🎮',
      'Home Invasion DLC': '🏘️',
      'Los Sueños Stories': '🌆',
      'Dark Waters DLC': '🌊',
      'Boiling Point DLC': '🔥'
    };

    function initializePage() {
      loadTheme();
      renderMissions();
      loadData();
      updateProgress();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      const currentTheme = html.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      html.setAttribute('data-theme', newTheme);
      button.textContent = newTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
      localStorage.setItem('ron-theme', newTheme);
    }

    function loadTheme() {
      const saved = localStorage.getItem('ron-theme') || 'light';
      const html = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      
      html.setAttribute('data-theme', saved);
      button.textContent = saved === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    function renderMissions() {
      const container = document.getElementById('missions-container');
      let currentCategory = '';

      missions.forEach(mission => {
        if (mission.category !== currentCategory) {
          currentCategory = mission.category;
          const categoryDiv = document.createElement('div');
          categoryDiv.className = 'category-section';
          
          const title = document.createElement('div');
          title.className = 'category-title';
          title.textContent = `${categoryEmojis[currentCategory] || ''} ${currentCategory}`;
          categoryDiv.appendChild(title);
          
          categoryDiv.id = `category-${currentCategory.replace(/\s+/g, '-')}`;
          container.appendChild(categoryDiv);
        }

        const categoryDiv = document.getElementById(`category-${currentCategory.replace(/\s+/g, '-')}`);
        
        const card = document.createElement('div');
        card.className = 'mission-card';
        card.id = `mission-${mission.id}`;
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'mission-title';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'mission-checkbox';
        checkbox.dataset.id = mission.id;
        checkbox.onchange = () => {
          updateProgress();
          saveData();
          updateCardAppearance(mission.id);
        };
        
        const titleText = document.createElement('span');
        titleText.textContent = mission.name;
        
        const badge = document.createElement('span');
        badge.className = `difficulty-badge difficulty-${mission.difficulty}`;
        badge.textContent = mission.difficulty === 'easy' ? 'Einstieg' : mission.difficulty === 'medium' ? 'Mittel' : 'Schwierig';
        
        titleDiv.appendChild(checkbox);
        titleDiv.appendChild(titleText);
        titleDiv.appendChild(badge);
        card.appendChild(titleDiv);
        
        const mapDiv = document.createElement('div');
        mapDiv.className = 'mission-map';
        mapDiv.textContent = `Karte: ${mission.map}`;
        card.appendChild(mapDiv);
        
        if (mission.tip) {
          const spoilerToggle = document.createElement('div');
          spoilerToggle.className = 'spoiler-toggle';
          spoilerToggle.onclick = (e) => {
            e.stopPropagation();
            spoilerToggle.classList.toggle('revealed');
            spoilerContent.classList.toggle('revealed');
          };
          spoilerToggle.innerHTML = '<span class="spoiler-arrow">▶</span> <span>SPOILER - Klick zum Anzeigen</span>';
          card.appendChild(spoilerToggle);

          const spoilerContent = document.createElement('div');
          spoilerContent.className = 'spoiler-content';
          const tipDiv = document.createElement('div');
          tipDiv.className = 'tip';
          tipDiv.textContent = '💡 ' + mission.tip;
          spoilerContent.appendChild(tipDiv);
          card.appendChild(spoilerContent);
        }
        
        categoryDiv.appendChild(card);
      });
    }

    function updateCardAppearance(missionId) {
      const checkbox = document.querySelector(`input[data-id="${missionId}"]`);
      const card = document.getElementById(`mission-${missionId}`);
      if (checkbox.checked) {
        card.classList.add('completed');
      } else {
        card.classList.remove('completed');
      }
    }

    function updateProgress() {
      const checkboxes = document.querySelectorAll('.mission-checkbox');
      const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
      const total = checkboxes.length;
      
      document.getElementById('completed-num').textContent = checked;
      document.getElementById('total-num').textContent = total;
      
      const percentage = total > 0 ? Math.round((checked / total) * 100) : 0;
      document.getElementById('percentage-num').textContent = percentage + '%';
      
      const progressFill = document.getElementById('progressFill');
      progressFill.style.width = percentage + '%';
    }

    function saveData() {
      const checkboxes = document.querySelectorAll('.mission-checkbox');
      const data = Array.from(checkboxes).map(cb => cb.checked);
      localStorage.setItem('ron-s-rang-data', JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem('ron-s-rang-data');
      if (saved) {
        const data = JSON.parse(saved);
        const checkboxes = document.querySelectorAll('.mission-checkbox');
        checkboxes.forEach((cb, i) => {
          if (data[i]) {
            cb.checked = true;
            updateCardAppearance(parseInt(cb.dataset.id));
          }
        });
      }
    }

    function selectAll() {
      document.querySelectorAll('.mission-checkbox').forEach(cb => {
        cb.checked = true;
        updateCardAppearance(parseInt(cb.dataset.id));
      });
      updateProgress();
      saveData();
    }

    function deselectAll() {
      document.querySelectorAll('.mission-checkbox').forEach(cb => {
        cb.checked = false;
        updateCardAppearance(parseInt(cb.dataset.id));
      });
      updateProgress();
      saveData();
    }

    function resetData() {
      if (confirm('🔄 Willst du wirklich alle Daten zurücksetzen?')) {
        localStorage.removeItem('ron-s-rang-data');
        deselectAll();
      }
    }

    // Initialize
    initializePage();
  </script>
</body>
</html>
